requires-python = ">=3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.0",
    "numpy==2.3.5",
    "peft==0.19.1",
    "safetensors==0.8.0",
    "scipy==1.17.1",
    "sentencepiece==0.2.1",
    "torch==2.13.0",
    "transformers==5.13.0",
]

[tool.uv]
package = false
